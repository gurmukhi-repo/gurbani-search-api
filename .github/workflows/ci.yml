name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The job that matters: the test suite must pass on a clean checkout with no
  # data packs downloaded. Everything that needs data is skip-gated, so a
  # contributor is never blocked on a 270MB download to send a patch.
  no-data:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run doctor
      - run: npm test
