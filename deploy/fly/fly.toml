# Fly.io deployment.
#
#   fly launch --no-deploy --copy-config --config deploy/fly/fly.toml
#   fly deploy --ha=false
#
# App names are global on Fly; change `app` below before your first deploy.
#
# NOTE: this image contains code only, so the data has to reach the machine
# somehow. Two ways: bake it in with a Dockerfile that COPYs ./data (simplest,
# bigger image, slower cold start), or put it on a Fly volume and mount it at
# /data. There is no other state, so the volume can be destroyed and refetched.
app = "CHANGE-ME"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ARTIFACTS_DIR = "/data/artifacts"
  MODELS_DIR = "/data/models"
  # One index rather than all of them: ~149MB resident instead of considerably
  # more. Drop this line to load everything the machine can see.
  INDEXES = "pa-ssa"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop when idle so a small deployment costs close to nothing. The first
  # request after a stop takes a few seconds while the vectors and the ONNX
  # session load -- there is no way around that, it is ~85MB off disk.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    # The one route that never requires credentials, so this works even with
    # APP_PASSWORD set.
    path = "/api/health"

[[vm]]
  # 256mb fits one index with no translations. The full pack set needs 512mb --
  # measure with `docker stats` before trusting either number for your packs.
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
